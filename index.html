<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171126" />
    <meta name="description" content="Mauseri - Das Geheimnis der Katzenwelt. Ein Katzen-Adventure fuer den Browser." />

    <!-- iOS: als App vom Homescreen startbar, ohne Browser-Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mauseri" />

    <!-- Relative Pfade, damit die Seite auch unter einem Unterpfad funktioniert. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />

    <title>Mauseri - Das Geheimnis der Katzenwelt</title>
    <style>
      /* Pre-boot styles: verhindern ein weisses Aufblitzen vor dem React-Mount. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #171126;
        color: #f4ecff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: radial-gradient(circle at 50% 40%, #2a1f47 0%, #171126 70%);
        z-index: 999;
      }
      #boot-splash .title {
        font-size: clamp(1.6rem, 7vw, 3rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ffd98a;
      }
      #boot-splash .sub {
        font-size: 0.85rem;
        opacity: 0.7;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <div class="title">Mauseri</div>
      <div class="sub">MIAURIEN ERWACHT&hellip;</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
