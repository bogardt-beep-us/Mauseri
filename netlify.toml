[build]
  command = "npm run build"
  publish = "dist"

# Einstiegspunkt fuer die Single-Page-Anwendung: unbekannte Pfade landen auf
# index.html, damit ein direkt aufgerufener Link nicht ins Leere geht.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Die Dateien in assets/ tragen einen Hash im Namen und aendern sich nie unter
# demselben Pfad - sie duerfen dauerhaft im Cache bleiben.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker und Einstiegsseite muessen dagegen jedes Mal geprueft werden,
# sonst kommen Aktualisierungen beim Spieler nie an.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
